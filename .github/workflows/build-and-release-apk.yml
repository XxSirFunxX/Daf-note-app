name: Build, Test & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (Only active when ENABLE_RELEASE_PUBLISHING is true)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Master switch for Release builds and GitHub Releases.
  # Set to 'true' only when release signing secrets (RELEASE_KEYSTORE_BASE64,
  # STORE_PASSWORD, KEY_PASSWORD) are configured in GitHub Secrets.
  # Defaults to 'false' so that release publishing is completely disabled.
  ENABLE_RELEASE_PUBLISHING: ${{ vars.ENABLE_RELEASE_PUBLISHING || 'true' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # =======================================================================
      # DEBUG BUILD PIPELINE (Default CI path - completely independent of release secrets)
      # =======================================================================

      - name: Setup Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -f "debug.keystore" ]; then
            echo "Existing debug.keystore found in workspace."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring persistent debug keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring persistent debug keystore from repository file debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ -f "app/debug.keystore.base64" ]; then
            echo "Restoring persistent debug keystore from app/debug.keystore.base64..."
            base64 --decode app/debug.keystore.base64 > debug.keystore
          else
            echo "::warning::No persistent debug keystore found! (DEBUG_KEYSTORE_BASE64 secret is not set)."
            echo "::warning::Generating an ephemeral debug keystore for this build. Note: APKs signed with ephemeral keys cannot be installed over previous versions."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "::error::debug.keystore is empty or missing!"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Debug APK Signature
        id: verify_debug_apk
        run: |
          set -e
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found at $DEBUG_APK"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          APKSIGNER_BIN=""
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            APKSIGNER_BIN="$BUILD_TOOLS_DIR/apksigner"
          elif command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN="$(command -v apksigner)"
          fi

          if [ -n "$APKSIGNER_BIN" ]; then
            echo "Verifying debug APK signature..."
            CERT_INFO=$("$APKSIGNER_BIN" verify --print-certs "$DEBUG_APK" 2>&1 || true)
            SHA256_FINGERPRINT=$(echo "$CERT_INFO" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d '[:space:]' || true)
            echo "Debug APK Certificate SHA-256: $SHA256_FINGERPRINT"
            echo "debug_cert_sha256=$SHA256_FINGERPRINT" >> $GITHUB_OUTPUT
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # =======================================================================
      # RELEASE BUILD PIPELINE (Disabled until ENABLE_RELEASE_PUBLISHING is true)
      # =======================================================================

      - name: Setup Release Keystore
        id: setup_keystore
        if: ${{ (vars.ENABLE_RELEASE_PUBLISHING == 'true' || env.ENABLE_RELEASE_PUBLISHING == 'true') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))) }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          echo "Validating release signing credentials..."
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required release signing secrets! RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD must be configured in GitHub Repository Secrets."
            exit 1
          fi

          KEYSTORE_DEST="$RUNNER_TEMP/release.keystore"
          echo "Decoding release keystore to $KEYSTORE_DEST..."
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"

          if [ ! -s "$KEYSTORE_DEST" ]; then
            echo "::error::Decoded keystore at $KEYSTORE_DEST is empty or invalid!"
            exit 1
          fi
          echo "keystore_path=$KEYSTORE_DEST" >> $GITHUB_OUTPUT
          echo "store_password=$STORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_alias=${KEY_ALIAS:-upload}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        if: ${{ (vars.ENABLE_RELEASE_PUBLISHING == 'true' || env.ENABLE_RELEASE_PUBLISHING == 'true') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))) }}
        env:
          KEYSTORE_PATH: ${{ steps.setup_keystore.outputs.keystore_path }}
          STORE_PASSWORD: ${{ steps.setup_keystore.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.setup_keystore.outputs.key_password }}
          KEY_ALIAS: ${{ steps.setup_keystore.outputs.key_alias }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and Package Release Artifacts
        id: verify_apk
        if: ${{ (vars.ENABLE_RELEASE_PUBLISHING == 'true' || env.ENABLE_RELEASE_PUBLISHING == 'true') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))) }}
        env:
          EXPECTED_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -e
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          ARTIFACT_DIR="release-artifacts"
          TARGET_APK="$ARTIFACT_DIR/app-release.apk"

          if [ ! -s "$APK_SOURCE" ]; then
            echo "::error::Generated release APK does not exist or is empty at $APK_SOURCE"
            exit 1
          fi

          echo "Verifying ZIP integrity..."
          unzip -t "$APK_SOURCE" > /dev/null

          mkdir -p "$ARTIFACT_DIR"
          cp "$APK_SOURCE" "$TARGET_APK"

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)

          AAPT2_BIN=""
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            AAPT2_BIN="$BUILD_TOOLS_DIR/aapt2"
          elif command -v aapt2 >/dev/null 2>&1; then
            AAPT2_BIN="$(command -v aapt2)"
          fi

          APKSIGNER_BIN=""
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            APKSIGNER_BIN="$BUILD_TOOLS_DIR/apksigner"
          elif command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN="$(command -v apksigner)"
          fi

          # Verify package name
          if [ -n "$AAPT2_BIN" ]; then
            PKG_NAME=$("$AAPT2_BIN" dump packagename "$TARGET_APK")
            echo "Detected Package Name: $PKG_NAME"
            if [ "$PKG_NAME" != "com.daf.notenegar" ]; then
              echo "::error::Unexpected package name $PKG_NAME (expected com.daf.notenegar)"
              exit 1
            fi

            # Verify release manifest is NOT debuggable
            echo "Checking if release APK is debuggable..."
            IS_DEBUGGABLE=$("$AAPT2_BIN" dump xmltree "$TARGET_APK" --file AndroidManifest.xml | grep -i "android:debuggable" | grep -E -i "true|0xffffffff" || true)
            if [ -n "$IS_DEBUGGABLE" ]; then
              echo "::error::Release APK must NOT have android:debuggable=true!"
              exit 1
            fi
            echo "Manifest verification passed: APK is not debuggable."
          else
            echo "::warning::aapt2 not found; skipping package name and manifest check."
          fi

          # Signature verification
          if [ -n "$APKSIGNER_BIN" ]; then
            echo "Verifying APK signature..."
            "$APKSIGNER_BIN" verify --verbose "$TARGET_APK"
            CERT_INFO=$("$APKSIGNER_BIN" verify --print-certs "$TARGET_APK")
            echo "$CERT_INFO"

            RAW_DIGEST=$(echo "$CERT_INFO" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d '[:space:]')
            EXTRACTED_SHA256=$(echo "$RAW_DIGEST" | tr -d ':' | tr '[:upper:]' '[:lower:]')

            if [ -z "$EXTRACTED_SHA256" ]; then
              echo "::error::Could not extract certificate SHA-256 digest from apksigner output!"
              exit 1
            fi
            echo "Extracted Certificate SHA-256: $EXTRACTED_SHA256"

            if [ -n "$EXPECTED_SHA256" ]; then
              NORM_EXPECTED=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
              if [ "$EXTRACTED_SHA256" != "$NORM_EXPECTED" ]; then
                echo "::error::Certificate fingerprint mismatch! Expected: $NORM_EXPECTED, Got: $EXTRACTED_SHA256"
                exit 1
              fi
              echo "Certificate fingerprint matched expected repository variable."
            fi
            echo "cert_sha256=$EXTRACTED_SHA256" >> $GITHUB_OUTPUT
            echo "$EXTRACTED_SHA256" > "$ARTIFACT_DIR/certificate-sha256.txt"
          else
            echo "::error::apksigner not found; unable to verify signature!"
            exit 1
          fi

          echo "Calculating SHA-256 checksum..."
          cd "$ARTIFACT_DIR"
          sha256sum app-release.apk > app-release.apk.sha256
          cd - > /dev/null

      - name: Cleanup Decoded Keystore
        if: always()
        env:
          KEYSTORE_PATH: ${{ steps.setup_keystore.outputs.keystore_path }}
        run: |
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            rm -f "$KEYSTORE_PATH"
            echo "Scrubbed decoded release keystore from runner temp."
          fi

      - name: Upload Release Artifacts
        if: ${{ (vars.ENABLE_RELEASE_PUBLISHING == 'true' || env.ENABLE_RELEASE_PUBLISHING == 'true') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            release-artifacts/
          if-no-files-found: ignore

      - name: Determine Release Tag and Title
        id: release_meta
        if: ${{ (vars.ENABLE_RELEASE_PUBLISHING == 'true' || env.ENABLE_RELEASE_PUBLISHING == 'true') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))) }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="Release $TAG"
          else
            TAG="v1.1-b${{ github.run_number }}"
            TITLE="Release v1.1 (Build #${{ github.run_number }})"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: ${{ (vars.ENABLE_RELEASE_PUBLISHING == 'true' || env.ENABLE_RELEASE_PUBLISHING == 'true') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true'))) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body: |
            ### Official Release — Daf Note App
            - **Commit:** `${{ github.sha }}`
            - **Branch/Tag:** `${{ github.ref_name }}`
            - **Build:** `#${{ github.run_number }}`

            #### Signing Certificate Fingerprint (SHA-256)
            ```
            ${{ steps.verify_apk.outputs.cert_sha256 }}
            ```

            #### APK SHA-256 Checksum
            ```
            ${{ hashFiles('release-artifacts/app-release.apk') }}  app-release.apk
            ```
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.apk.sha256
            release-artifacts/certificate-sha256.txt
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
