name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "Setting up stable signing keystore..."

          # Safe Diagnostics (Only reporting yes/no, never secret content)
          if [ -f "debug.keystore.base64" ]; then
            echo "Diagnostic: debug.keystore.base64 exists: yes"
          else
            echo "Diagnostic: debug.keystore.base64 exists: no"
          fi

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Diagnostic: RELEASE_KEYSTORE_BASE64 is set: yes"
          else
            echo "Diagnostic: RELEASE_KEYSTORE_BASE64 is set: no"
          fi

          # Keystore Restoration Logic
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring persistent keystore from repository debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Restoring keystore from GitHub Secrets (RELEASE_KEYSTORE_BASE64)..."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore in workspace..."
          else
            echo "Error: Persistent keystore is missing! Neither debug.keystore.base64 nor RELEASE_KEYSTORE_BASE64 is available." >&2
            exit 1
          fi

          # Validation
          if [ -s "debug.keystore" ]; then
            echo "Diagnostic: debug.keystore exists and is nonempty: yes"
            echo "Keystore verified successfully. Size: $(wc -c < debug.keystore) bytes."
          else
            echo "Diagnostic: debug.keystore exists and is nonempty: no"
            echo "Error: debug.keystore is missing or empty after decoding!" >&2
            exit 1
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify and Prepare Release Artifacts
        id: verify_apk
        run: |
          set -e
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          ARTIFACT_DIR="release-artifacts"
          TARGET_APK="$ARTIFACT_DIR/app-debug.apk"
          TARGET_CHECKSUM="$ARTIFACT_DIR/app-debug.apk.sha256"

          echo "Checking APK existence..."
          if [ ! -s "$APK_SOURCE" ]; then
            echo "Error: Generated APK does not exist or is empty at $APK_SOURCE" >&2
            exit 1
          fi

          echo "Verifying ZIP integrity..."
          unzip -t "$APK_SOURCE" > /dev/null

          mkdir -p "$ARTIFACT_DIR"
          cp "$APK_SOURCE" "$TARGET_APK"

          echo "Verifying package name..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/aapt2" ]; then
            PKG_NAME=$("$BUILD_TOOLS_DIR/aapt2" dump packagename "$TARGET_APK")
            echo "Detected Package Name: $PKG_NAME"
            if [ "$PKG_NAME" != "com.daf.notenegar" ]; then
              echo "Error: Unexpected package name $PKG_NAME" >&2
              exit 1
            fi
          fi

          echo "Verifying APK signature and extracting certificate fingerprints..."
          EXPECTED_SHA256="ea38639be78d94fecdeccaa1b6c1e4f87aa0f77d0fc8ed5b6e6fdb5dc02f8a1d"
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$TARGET_APK"
            CERT_INFO=$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$TARGET_APK")
            echo "$CERT_INFO"
            EXTRACTED_SHA256=$(echo "$CERT_INFO" | grep -i "Signer #1 certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}' || true)
            if [ -z "$EXTRACTED_SHA256" ]; then
              echo "Error: Could not extract Signer #1 certificate SHA-256 digest!" >&2
              exit 1
            fi
            echo "Extracted Certificate SHA-256: $EXTRACTED_SHA256"
            echo "Expected Certificate SHA-256:  $EXPECTED_SHA256"
            if [ "${EXTRACTED_SHA256,,}" != "${EXPECTED_SHA256,,}" ]; then
              echo "Error: Certificate fingerprint mismatch! APK signature does not match expected persistent key." >&2
              echo "Extracted: ${EXTRACTED_SHA256,,}" >&2
              echo "Expected:  ${EXPECTED_SHA256,,}" >&2
              exit 1
            fi
            CERT_SHA256="${EXTRACTED_SHA256,,}"
          else
            echo "Error: apksigner tool not found in $BUILD_TOOLS_DIR!" >&2
            exit 1
          fi
          echo "Certificate verification passed successfully."
          echo "$CERT_SHA256" > "$ARTIFACT_DIR/certificate-sha256.txt"
          echo "cert_sha256=$CERT_SHA256" >> $GITHUB_OUTPUT

          echo "Calculating SHA-256 checksum..."
          cd "$ARTIFACT_DIR"
          sha256sum app-debug.apk > app-debug.apk.sha256
          cd - > /dev/null

          echo "Generated SHA-256 Checksum:"
          cat "$TARGET_CHECKSUM"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}.${{ github.run_attempt }}
          name: "Release v${{ github.run_number }}.${{ github.run_attempt }}"
          body: |
            ### Automated Debug Build
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Build Run:** `${{ github.run_number }}` (Attempt `${{ github.run_attempt }}`)
            - **Direct Download Link:** `https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk`

            #### Signing Certificate Fingerprint (SHA-256)
            ```
            ${{ steps.verify_apk.outputs.cert_sha256 }}
            ```

            #### APK SHA-256 Checksum
            ```
            ${{ hashFiles('release-artifacts/app-debug.apk') }}  app-debug.apk
            ```
          files: |
            release-artifacts/app-debug.apk
            release-artifacts/app-debug.apk.sha256
            release-artifacts/certificate-sha256.txt
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
