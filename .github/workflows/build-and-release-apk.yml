name: Build, Test & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # =======================================================================
      # DEBUG SIGNING & BUILD (Uses persistent keystore from RELEASE_KEYSTORE_BASE64)
      # =======================================================================

      - name: Setup Debug Keystore
        id: setup_debug_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          KEYSTORE_PAYLOAD="${DEBUG_KEYSTORE_BASE64:-$RELEASE_KEYSTORE_BASE64}"

          if [ -f "debug.keystore" ]; then
            echo "debug.keystore is already present in workspace."
          elif [ -n "$KEYSTORE_PAYLOAD" ]; then
            echo "Decoding persistent debug keystore from configured GitHub Secret..."
            printf '%s' "$KEYSTORE_PAYLOAD" | base64 --decode > debug.keystore
            echo "was_decoded=true" >> $GITHUB_OUTPUT
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding persistent debug keystore from repository file debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
            echo "was_decoded=true" >> $GITHUB_OUTPUT
          elif [ -f "app/debug.keystore.base64" ]; then
            echo "Decoding persistent debug keystore from app/debug.keystore.base64..."
            base64 --decode app/debug.keystore.base64 > debug.keystore
            echo "was_decoded=true" >> $GITHUB_OUTPUT
          else
            echo "::error::No debug keystore source found! Neither RELEASE_KEYSTORE_BASE64 nor DEBUG_KEYSTORE_BASE64 secret is configured in GitHub repository secrets, and no debug.keystore.base64 file was found. An ephemeral keystore will NOT be generated to avoid breaking app upgrade compatibility."
            exit 1
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "::error::Decoded debug.keystore is empty or invalid!"
            exit 1
          fi
          echo "Debug keystore configured successfully."

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Debug APK
        id: verify_apk
        run: |
          set -e
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$DEBUG_APK" ]; then
            echo "::error::Generated debug APK does not exist or is empty at $DEBUG_APK"
            exit 1
          fi

          echo "Verifying ZIP integrity of app-debug.apk..."
          unzip -t "$DEBUG_APK" > /dev/null

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)

          AAPT2_BIN=""
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            AAPT2_BIN="$BUILD_TOOLS_DIR/aapt2"
          elif command -v aapt2 >/dev/null 2>&1; then
            AAPT2_BIN="$(command -v aapt2)"
          fi

          APKSIGNER_BIN=""
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            APKSIGNER_BIN="$BUILD_TOOLS_DIR/apksigner"
          elif command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN="$(command -v apksigner)"
          fi

          # Verify package name
          if [ -n "$AAPT2_BIN" ]; then
            PKG_NAME=$("$AAPT2_BIN" dump packagename "$DEBUG_APK")
            echo "Detected Package Name: $PKG_NAME"
            if [ "$PKG_NAME" != "com.daf.notenegar" ]; then
              echo "::error::Unexpected package name $PKG_NAME (expected com.daf.notenegar)"
              exit 1
            fi
          else
            echo "::warning::aapt2 not found; skipping package name check."
          fi

          # Signature verification
          if [ -n "$APKSIGNER_BIN" ]; then
            echo "Verifying APK signature..."
            "$APKSIGNER_BIN" verify --verbose "$DEBUG_APK"
            CERT_INFO=$("$APKSIGNER_BIN" verify --print-certs "$DEBUG_APK")
            echo "$CERT_INFO"

            RAW_DIGEST=$(echo "$CERT_INFO" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d '[:space:]')
            EXTRACTED_SHA256=$(echo "$RAW_DIGEST" | tr -d ':' | tr '[:upper:]' '[:lower:]')

            if [ -z "$EXTRACTED_SHA256" ]; then
              echo "::error::Could not extract certificate SHA-256 digest from apksigner output!"
              exit 1
            fi
            echo "Extracted Certificate SHA-256: $EXTRACTED_SHA256"
            echo "cert_sha256=$EXTRACTED_SHA256" >> $GITHUB_OUTPUT
          else
            echo "::warning::apksigner not found; unable to verify signature output."
          fi

      - name: Upload Debug APK (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # =======================================================================
      # GITHUB RELEASES PUBLISHING (Attaches app-debug.apk to GitHub Releases)
      # =======================================================================

      - name: Prepare Release Assets
        id: prepare_release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true')) }}
        run: |
          set -e
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$ARTIFACT_DIR/app-debug.apk"

          cd "$ARTIFACT_DIR"
          sha256sum app-debug.apk > app-debug.apk.sha256
          cd - > /dev/null

          if [ -n "${{ steps.verify_apk.outputs.cert_sha256 }}" ]; then
            echo "${{ steps.verify_apk.outputs.cert_sha256 }}" > "$ARTIFACT_DIR/certificate-sha256.txt"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="Release $TAG"
          else
            TAG="v1.1-b${{ github.run_number }}"
            TITLE="Release v1.1 (Build #${{ github.run_number }})"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || github.event.inputs.publish_release == 'true')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          name: ${{ steps.prepare_release.outputs.release_title }}
          body: |
            ### Daf Note App — Debug Build
            - **Commit:** `${{ github.sha }}`
            - **Branch/Tag:** `${{ github.ref_name }}`
            - **Build Number:** `#${{ github.run_number }}`

            #### Signing Certificate Fingerprint (SHA-256)
            ```
            ${{ steps.verify_apk.outputs.cert_sha256 }}
            ```

            #### APK SHA-256 Checksum
            ```
            ${{ hashFiles('release-artifacts/app-debug.apk') }}  app-debug.apk
            ```
          files: |
            release-artifacts/app-debug.apk
            release-artifacts/app-debug.apk.sha256
            release-artifacts/certificate-sha256.txt
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
